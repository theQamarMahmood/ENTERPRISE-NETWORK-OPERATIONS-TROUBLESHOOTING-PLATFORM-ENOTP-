version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: enotp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enotp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enotp-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: enotp-backend
    ports:
      - "8000:8000"
      - "514:514/udp"   # Syslog Receiver
      - "2055:2055/udp" # NetFlow Collector
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - ENOTP_ENCRYPTION_KEY=t-33VbWhYQ1NlK4R9M5dJkI4j8P0Z9C-gS11o94_u_g=
      - DEFAULT_DISCOVERY_SUBNETS=192.168.1.0/24
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: enotp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
